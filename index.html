<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lägerelden – spirituell guide</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0b1a;--bg2:#1a1430;--ink:#efe6d2;--dim:#a89ec0;--gold:#d9b25f;--card:rgba(255,255,255,.06);--line:rgba(217,178,95,.3);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0e0b1a}}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 120%,#3a1d2e 0,var(--bg2) 40%,var(--bg) 80%);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;display:flex;flex-direction:column}
header{text-align:center;padding:14px 16px 6px}
h1{margin:0;font-weight:600;font-size:1.7rem;color:var(--gold);letter-spacing:.06em}
.by{color:var(--dim);font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;margin-bottom:4px}
header p{margin:2px 0 0;color:var(--dim);font-style:italic;font-size:1rem}
.topics{text-align:center;padding:4px 14px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:8px 0}
.menu-btn{display:none;background:var(--card);color:var(--gold);border:1px solid var(--line);border-radius:999px;padding:7px 18px;font:inherit;cursor:pointer}
@media (max-width:640px){
.menu-btn{display:inline-block}
.chips{display:none;flex-direction:column;align-items:stretch;flex-wrap:nowrap;max-width:260px;margin:8px auto 0;padding:10px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.chips.open{display:flex}
}
.chips button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:.95rem;cursor:pointer}
.chips button:hover{background:rgba(217,178,95,.18)}
#log{flex:1;overflow-y:auto;padding:10px 16px;max-width:760px;width:100%;margin:0 auto}
.m{margin:12px 0;padding:12px 16px;border-radius:14px;white-space:pre-wrap;line-height:1.55}
.u{background:rgba(217,178,95,.14);margin-left:15%;border:1px solid var(--line)}
.g{background:var(--card);border-left:3px solid var(--gold)}
.listen{display:block;margin-top:10px;background:none;color:var(--gold);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.listen:hover{background:rgba(217,178,95,.15)}
.hint{color:var(--dim);font-style:italic;text-align:center}
form,.bar{display:flex;gap:8px;padding:10px 14px 14px;max-width:760px;width:100%;margin:0 auto}
textarea{flex:1;resize:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;min-height:48px;max-height:140px}
.go{background:var(--gold);color:#1b1230;border:0;border-radius:12px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
.go:disabled{opacity:.5}
small{display:block;text-align:center;color:var(--dim);padding:0 16px 8px;font-size:.8rem}
</style>
</head>
<body>
<header><div class="by">Producerad av SPiRiTUELL Samverkan</div><h1>✦ Lägerelden ✦</h1><p>Sätt dig ner. Elden är varm och stjärnorna lyssnar.</p></header>
<nav class="topics"><button class="menu-btn" id="mb" aria-expanded="false">✦ Ämnen ▾</button><div class="chips" id="chips"></div></nav>
<div id="log"><div class="m hint">Fråga om stjärnorna, korten, myterna, årshjulet, drömmarna eller ditt eget inre landskap…</div></div>
<div class="bar"><textarea id="q" rows="1" placeholder="Vad söker du ljus kring?"></textarea><button class="go" id="send">Fråga</button></div>
<small>Divination är en spegel för självreflektion – inte ett facit. Du äger alltid ditt val.</small>

<script>
const GUIDE = `# ROLL
Du är en vis, grundad och intuitiv spirituell guide och berättare. Du förklarar spirituell visdom och esoterisk kunskap: astrologi (kartor, transiter, hus, synastri), tarot och orakelkort, mytologi, folklore och jämförande religion (nordisk, gnostisk, österländsk, urfolksvisdom), shamanism, animism, wicca, hedniska traditioner och årshjulet, meditation, pranayama, drömtydning, energihealing och subtil anatomi (chakran, aura, kristaller, reiki), symbolik, helig geometri, alkemi, synkronicitet samt New Age-koncept (manifestation, karma, själskontrakt).
# TON
Du talar som en lugn berättare vid en lägereld under stjärnhimlen. Grundad, närvarande, mystisk men aldrig flummig eller klichéfylld. Poetiskt språk rotat i natur, element, ljus och skugga, minnen och arketyper. Väv in myter och bilder i stället för att lista fakta. Oskyndat tempo, luftiga meningar. Möt alla vägar med värme, vördnad och nyfikenhet.
# ÄMNEN
- Tarot/orakel: beskriv bildspråk, berättelse och arketypisk energi. Grunda tolkningen i sökarens fria vilja; divination är en spegel, inte ett öde.
- Astrologi: planeter som kosmiskt väder och levande krafter i psyket.
- Shamanism/jordbaserad visdom: hedra årstider och elementen (Jord, Luft, Eld, Vatten, Spiritus). Ge övningar med vördnad och trygghet.
- Mytologi och religion: berätta traditioner respektfullt och i sitt sammanhang, utan att rangordna dem. Skilj på vad traditionen säger, vad historien visar och vad som är personlig tolkning.
# TRYGGHET
Ge aldrig medicinska, juridiska eller ekonomiska besked eller dödsprofetior; hänvisa vänligt till rätt människor. Om sökaren verkar vara i kris eller nämner självskada: sänk tempot, var varm och uppmuntra kontakt med någon nära eller akut hjälp (i Sverige 112, eller Självmordslinjen 90101). Svara alltid på svenska om inget annat önskas. Håll svaren lagom långa, ofta 120-250 ord, och avsluta gärna med en mjuk reflektionsfråga.`;
const TOPICS=[["Dra ett kort","Dra ett tarotkort åt mig, beskriv bilden och berättelsen och hjälp mig reflektera."],["Min planet","Berätta om Saturnus som en levande kraft i psyket."],["Årshjulet","Vilken del av årshjulet befinner vi oss i nu, och hur kan jag hedra den?"],["Nordisk myt","Berätta en nordisk myt som kan lära mig något om förändring."],["Meditation","Guida mig genom en kort andningsövning för att landa."],["Drömtydning","Jag vill förstå en dröm. Hur närmar vi oss den?"],["Chakran","Förklara hjärtchakrat och hur man kan vårda det."]];
const log=document.getElementById('log'),q=document.getElementById('q'),btn=document.getElementById('send');
let hist=[],busy=false,sample=null;
const chips=document.getElementById('chips'),mb=document.getElementById('mb');
function closeMenu(){chips.classList.remove('open');mb.setAttribute('aria-expanded','false')}
mb.onclick=()=>mb.setAttribute('aria-expanded',chips.classList.toggle('open'));
TOPICS.forEach(([l,p])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{closeMenu();ask(p)};chips.append(b)});
function add(cls,t){const d=document.createElement('div');d.className='m '+cls;d.textContent=t;log.append(d);log.scrollTop=log.scrollHeight;return d}
const TTS='speechSynthesis' in window;let tok=0,cur=null;
function resetBtn(){if(cur){cur.textContent='🔊 Lyssna';cur=null}}
function speak(text,btn){
  const s=window.speechSynthesis;
  if(cur===btn){tok++;s.cancel();resetBtn();return}
  tok++;s.cancel();resetBtn();
  const my=tok,sv=s.getVoices().filter(x=>x.lang.toLowerCase().startsWith('sv'));
  const v=sv.find(x=>/natural|neural|online|google/i.test(x.name))||sv[0];
  const clean=text.replace(/\n{2,}/g,'. ').replace(/\n/g,' ').replace(/[–—]/g,', ').replace(/[()]/g,', ')
    .replace(/[^\p{L}\p{N}\s.,!?;:'’"-]/gu,' ').replace(/\s*-\s+/g,', ').replace(/([.,!?;:])\s*([.,;:])+/g,'$1').replace(/\s+/g,' ').trim();
  const sents=(clean.match(/[^.!?]+[.!?]*/g)||[clean]).map(p=>p.trim()).filter(Boolean);
  const parts=[];let buf='';
  sents.forEach(x=>{if(buf&&(buf+' '+x).length>220){parts.push(buf);buf=x}else buf=buf?buf+' '+x:x});
  if(buf)parts.push(buf);
  cur=btn;btn.textContent='⏹ Stoppa';
  parts.forEach((p,i)=>{
    const u=new SpeechSynthesisUtterance(p);u.lang='sv-SE';if(v)u.voice=v;u.rate=.93;u.pitch=.8;u.volume=1;
    const done=()=>{if(tok===my)resetBtn()};
    if(i===parts.length-1)u.onend=done;u.onerror=done;
    s.speak(u);
  });
}
function addListen(out,text){
  if(!TTS)return;
  const b=document.createElement('button');b.className='listen';b.textContent='🔊 Lyssna';
  b.onclick=()=>speak(text,b);out.append(b);
}
async function ask(text){
  text=(text||'').trim();if(!text||busy)return;
  if(TTS){tok++;speechSynthesis.cancel();resetBtn()}
  busy=true;btn.disabled=true;q.value='';
  add('u',text);
  hist.push({role:'user',content:text});
  const out=add('g','…');
  try{
    if(!sample)sample=await claude.use('sample');
    if(!sample){out.textContent='Elden kan inte tändas här just nu. Öppna sidan i Claude för att tala med guiden.';hist.pop();return}
    const msgs=hist.slice(-12).map(m=>({...m}));
    msgs[0]={role:'user',content:'<instruktioner>\n'+GUIDE+'\n</instruktioner>\n\n'+(msgs[0].content)};
    if(msgs[0].role!=='user')msgs.unshift({role:'user',content:GUIDE});
    const r=await sample(msgs,{cache:false,onText:({text})=>{out.textContent=text;log.scrollTop=log.scrollHeight}});
    out.textContent=r.text;hist.push({role:'assistant',content:r.text});addListen(out,r.text);
  }catch(e){
    out.textContent=e&&e.code==='rate_limited'?'Låt elden vila en stund och försök igen strax.':'Stjärnorna är skymda just nu. Försök igen om en stund.';
    hist.pop();
  }finally{busy=false;btn.disabled=false;log.scrollTop=log.scrollHeight}
}
btn.onclick=()=>ask(q.value);
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(q.value)}});
</script>
</body>
</html>
