<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lägerelden – spirituell guide</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1f3d;--dim:#5f6485;--blue:#4a6bff;--violet:#b98cff;--gold:#d9a21f;--glass:rgba(255,255,255,.72);--line:rgba(110,125,230,.28);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:radial-gradient(900px 520px at 5% -10%,#cdd7ff 0,transparent 62%),radial-gradient(800px 640px at 100% 35%,#e3d1ff 0,transparent 62%),linear-gradient(180deg,#eef0ff,#f6f1ff 60%,#e8ecff);color:var(--ink);font-family:"Inter",system-ui,sans-serif;font-size:16px;display:flex;flex-direction:column;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(circle,rgba(217,162,31,.55) 0 1.5px,transparent 2.5px),radial-gradient(circle,rgba(74,107,255,.4) 0 1px,transparent 2px);background-size:170px 130px,110px 190px;background-position:20px 30px,80px 90px}
header,.topics,#log,.bar,small{position:relative}
header{text-align:center;padding:16px 16px 4px}
.by{display:inline-block;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 16px;color:var(--blue);font-size:.72rem;font-weight:600;letter-spacing:.14em;margin-bottom:8px;box-shadow:0 4px 16px rgba(74,107,255,.1)}
h1{margin:0;font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:clamp(2.2rem,8vw,3.2rem);line-height:1.05;color:var(--ink)}
h1 .b{background:linear-gradient(90deg,#4a6bff,#b98cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{position:absolute;top:14px;right:18px;width:76px;height:auto;animation:spin 60s linear infinite;filter:drop-shadow(0 6px 10px rgba(74,107,255,.3))}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.logo{animation:none}}
@media (max-width:640px){header{padding:16px 64px 4px}.logo{width:48px;top:12px;right:12px}}
header p{margin:6px 0 0;color:var(--dim);font-size:.98rem}
header p i{color:var(--gold);font-style:normal}
.topics{text-align:center;padding:4px 14px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:8px 0}
.menu-btn{display:none;background:var(--glass);color:var(--blue);border:1px solid var(--line);border-radius:999px;padding:8px 20px;font:inherit;font-weight:600;cursor:pointer}
@media (max-width:640px){
.menu-btn{display:inline-block}
.chips{display:none;flex-direction:column;align-items:stretch;flex-wrap:nowrap;max-width:260px;margin:8px auto 0;padding:10px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 32px rgba(74,107,255,.2)}
.chips.open{display:flex}
}
.chips button{flex:none;background:var(--glass);color:var(--blue);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font:inherit;font-size:.88rem;font-weight:500;cursor:pointer;transition:.15s}
.chips button:hover{background:var(--blue);color:#fff}
#log{flex:1;overflow-y:auto;padding:10px 16px;max-width:760px;width:100%;margin:0 auto}
.m{margin:12px 0;padding:14px 18px;border-radius:22px;white-space:pre-wrap;line-height:1.55}
.u{background:linear-gradient(135deg,#4a6bff,#7a86ff);color:#fff;margin-left:15%;border-bottom-right-radius:6px;box-shadow:0 8px 20px rgba(74,107,255,.25)}
.g{background:var(--glass);border:1px solid var(--line);border-bottom-left-radius:6px;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.28rem;line-height:1.5;box-shadow:0 8px 24px rgba(110,125,230,.12)}
.listen{display:block;margin-top:12px;background:none;color:var(--blue);border:1px solid var(--line);border-radius:999px;padding:5px 15px;font:inherit;font-family:"Inter",sans-serif;font-size:.8rem;font-weight:600;cursor:pointer}
.listen:hover{background:rgba(74,107,255,.1)}
.hint{color:var(--dim);text-align:center;background:none;border:0;box-shadow:none;font-size:1.15rem}
.bar{display:flex;gap:8px;padding:10px 14px 12px;max-width:760px;width:100%;margin:0 auto}
textarea{flex:1;resize:none;background:var(--glass);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:13px 18px;font:inherit;min-height:50px;max-height:140px;outline:none}
textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,107,255,.15)}
.go{background:var(--blue);color:#fff;border:0;border-radius:999px;padding:0 24px;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 8px 20px rgba(74,107,255,.35)}
.go:disabled{opacity:.5}
small{display:block;text-align:center;color:var(--dim);padding:0 16px 10px;font-size:.75rem}
</style>
</head>

- Astrologi: planeter som kosmiskt väder och levande krafter i psyket.
- Shamanism/jordbaserad visdom: hedra årstider och elementen (Jord, Luft, Eld, Vatten, Spiritus). Ge övningar med vördnad och trygghet.
- Mytologi och religion: berätta traditioner respektfullt och i sitt sammanhang, utan att rangordna dem. Skilj på vad traditionen säger, vad historien visar och vad som är personlig tolkning.
# TRYGGHET
Ge aldrig medicinska, juridiska eller ekonomiska besked eller dödsprofetior; hänvisa vänligt till rätt människor. Om sökaren verkar vara i kris eller nämner självskada: sänk tempot, var varm och uppmuntra kontakt med någon nära eller akut hjälp (i Sverige 112, eller Självmordslinjen 90101). Svara alltid på svenska om inget annat önskas. Håll svaren lagom långa, ofta 120-250 ord, och avsluta gärna med en mjuk reflektionsfråga.`;
const TOPICS=[["Dra ett kort","Dra ett tarotkort åt mig, beskriv bilden och berättelsen och hjälp mig reflektera."],["Min planet","Berätta om Saturnus som en levande kraft i psyket."],["Årshjulet","Vilken del av årshjulet befinner vi oss i nu, och hur kan jag hedra den?"],["Nordisk myt","Berätta en nordisk myt som kan lära mig något om förändring."],["Meditation","Guida mig genom en kort andningsövning för att landa."],["Drömtydning","Jag vill förstå en dröm. Hur närmar vi oss den?"],["Chakran","Förklara hjärtchakrat och hur man kan vårda det."]];
const log=document.getElementById('log'),q=document.getElementById('q'),btn=document.getElementById('send');
let hist=[],busy=false,sample=null;
const chips=document.getElementById('chips'),mb=document.getElementById('mb');
function closeMenu(){chips.classList.remove('open');mb.setAttribute('aria-expanded','false')}
mb.onclick=()=>mb.setAttribute('aria-expanded',chips.classList.toggle('open'));
TOPICS.forEach(([l,p])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{closeMenu();ask(p)};chips.append(b)});
function add(cls,t){const d=document.createElement('div');d.className='m '+cls;d.textContent=t;log.append(d);log.scrollTop=log.scrollHeight;return d}
const TTS='speechSynthesis' in window;let tok=0,cur=null;
function resetBtn(){if(cur){cur.textContent='🔊 Lyssna';cur=null}}
function speak(text,btn){
  const s=window.speechSynthesis;
  if(cur===btn){tok++;s.cancel();resetBtn();return}
  tok++;s.cancel();resetBtn();
  const my=tok,sv=s.getVoices().filter(x=>x.lang.toLowerCase().startsWith('sv'));
  const v=sv.find(x=>/natural|neural|online|google/i.test(x.name))||sv[0];
  const clean=text.replace(/\n{2,}/g,'. ').replace(/\n/g,' ').replace(/[–—]/g,', ').replace(/[()]/g,', ')
    .replace(/[^\p{L}\p{N}\s.,!?;:'’"-]/gu,' ').replace(/\s*-\s+/g,', ').replace(/([.,!?;:])\s*([.,;:])+/g,'$1').replace(/\s+/g,' ').trim();
  const sents=(clean.match(/[^.!?]+[.!?]*/g)||[clean]).map(p=>p.trim()).filter(Boolean);
  const parts=[];let buf='';
  sents.forEach(x=>{if(buf&&(buf+' '+x).length>220){parts.push(buf);buf=x}else buf=buf?buf+' '+x:x});
  if(buf)parts.push(buf);
  cur=btn;btn.textContent='⏹ Stoppa';
  parts.forEach((p,i)=>{
    const u=new SpeechSynthesisUtterance(p);u.lang='sv-SE';if(v)u.voice=v;u.rate=.93;u.pitch=.8;u.volume=1;
    const done=()=>{if(tok===my)resetBtn()};
    if(i===parts.length-1)u.onend=done;u.onerror=done;
    s.speak(u);
  });
}
function addListen(out,text){
  if(!TTS)return;
  const b=document.createElement('button');b.className='listen';b.textContent='🔊 Lyssna';
  b.onclick=()=>speak(text,b);out.append(b);
}
async function ask(text){
  text=(text||'').trim();if(!text||busy)return;
  if(TTS){tok++;speechSynthesis.cancel();resetBtn()}
  busy=true;btn.disabled=true;q.value='';
  add('u',text);
  hist.push({role:'user',content:text});
  const out=add('g','…');
  try{
    if(!sample)sample=await claude.use('sample');
    if(!sample){out.textContent='Elden kan inte tändas här just nu. Öppna sidan i Claude för att tala med guiden.';hist.pop();return}
    const msgs=hist.slice(-12).map(m=>({...m}));
    msgs[0]={role:'user',content:'<instruktioner>\n'+GUIDE+'\n</instruktioner>\n\n'+(msgs[0].content)};
    if(msgs[0].role!=='user')msgs.unshift({role:'user',content:GUIDE});
    const r=await sample(msgs,{cache:false,onText:({text})=>{out.textContent=text;log.scrollTop=log.scrollHeight}});
    out.textContent=r.text;hist.push({role:'assistant',content:r.text});addListen(out,r.text);
  }catch(e){
    out.textContent=e&&e.code==='rate_limited'?'Låt elden vila en stund och försök igen strax.':'Stjärnorna är skymda just nu. Försök igen om en stund.';
    hist.pop();
  }finally{busy=false;btn.disabled=false;log.scrollTop=log.scrollHeight}
}
btn.onclick=()=>ask(q.value);
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(q.value)}});
</script>
